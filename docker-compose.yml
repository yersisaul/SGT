# ──────────────────────────────────────────────────────────────────────────
# SGT — despliegue contenerizado: PostgreSQL + backend + frontend (nginx).
# Lee las variables del .env de esta carpeta. Solo se publica el puerto de
# nginx; la base de datos y el backend quedan en redes internas.
#
#   docker compose up -d --build
# ──────────────────────────────────────────────────────────────────────────
name: sgt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sgt}
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sgt-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    # Todas las variables del .env (JWT, SLA, KPI, rate limit…) y, encima,
    # las que cambian dentro de Docker.
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sgt}
      FILE_STORAGE_PATH: /app/uploads
      SERVER_FORWARD_HEADERS_STRATEGY: native
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Puerto abierto = Spring Boot terminó de arrancar (todos los endpoints exigen JWT).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - data
      - web

  frontend:
    build:
      context: ./src/frontend
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: sgt-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-25m}
      # Solo si hay otro proxy delante de nginx (ver DESPLIEGUE.md, "HTTPS").
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web

volumes:
  pgdata:
  uploads:

networks:
  # Sin salida a internet: solo backend ↔ base de datos.
  data:
    internal: true
  web:
