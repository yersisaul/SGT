spring.application.name=sgt

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.seed.default-password=${SEED_USERS_PASSWORD:ChangeMe123!}

# JWT_SECRET es obligatorio (>=32 caracteres, sin valor por defecto).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION:3600}

app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
app.rate-limit.auth-requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# SLA de despacho (fecha_registro + horas según prioridad para Solicitud;
# horas fijas para Requerimiento, que no tiene prioridad).
app.sla.despacho.baja-horas=${SLA_DESPACHO_BAJA_HORAS:4}
app.sla.despacho.media-horas=${SLA_DESPACHO_MEDIA_HORAS:2}
app.sla.despacho.alta-horas=${SLA_DESPACHO_ALTA_HORAS:1}
app.sla.despacho.requerimiento-horas=${SLA_DESPACHO_REQUERIMIENTO_HORAS:2}
