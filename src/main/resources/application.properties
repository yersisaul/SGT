spring.application.name=sgt

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sgt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Objetos que Hibernate no crea (secuencias ST/RQ/OT). Script idempotente,
# ejecutado en cada arranque después de Hibernate (ver db/init.sql).
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/init.sql
spring.jpa.defer-datasource-initialization=true

app.seed.default-password=${SEED_USERS_PASSWORD:ChangeMe123!}

# JWT_SECRET es obligatorio (>=32 caracteres, sin valor por defecto).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION:3600}

app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
app.rate-limit.auth-requests-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Almacenamiento de archivos (fileserver propio, filesystem local; sin
# MinIO/S3). app.storage.root debe ser una ruta persistente: en Docker se
# monta como volumen sobre esa misma ruta.
app.storage.root=${FILE_STORAGE_PATH:./uploads}
app.storage.image-max-size-mb=${FILE_IMAGE_MAX_SIZE_MB:5}
app.storage.document-max-size-mb=${FILE_DOCUMENT_MAX_SIZE_MB:10}

spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE_MB:10}MB
spring.servlet.multipart.max-request-size=${FILE_MAX_SIZE_MB:10}MB

# SLA de despacho (fecha_registro + horas según prioridad para Solicitud;
# horas fijas para Requerimiento, que no tiene prioridad).
app.sla.despacho.baja-horas=${SLA_DESPACHO_BAJA_HORAS:4}
app.sla.despacho.media-horas=${SLA_DESPACHO_MEDIA_HORAS:2}
app.sla.despacho.alta-horas=${SLA_DESPACHO_ALTA_HORAS:1}
app.sla.despacho.requerimiento-horas=${SLA_DESPACHO_REQUERIMIENTO_HORAS:2}

# SLA de atención (registro de la Solicitud → cierre de su OT, solo bajo contrato), por prioridad.
app.sla.atencion.alta-horas=${SLA_ATENCION_ALTA_HORAS:8}
app.sla.atencion.media-horas=${SLA_ATENCION_MEDIA_HORAS:24}
app.sla.atencion.baja-horas=${SLA_ATENCION_BAJA_HORAS:72}

# Notificaciones en tiempo real (SSE, PRD E5).
app.sse.timeout-minutes=${SSE_TIMEOUT_MINUTES:30}
app.sse.heartbeat-seconds=${SSE_HEARTBEAT_SECONDS:25}

# KPIs: zona horaria para interpretar los rangos de fechas (PRD E6).
app.kpi.zona-horaria=${KPI_ZONA_HORARIA:America/Lima}

# Escalado de OT en cola sin tomar, por prioridad de la Solicitud (minutos).
# Nivel 1 avisa a los responsables; al doble del tiempo, nivel 2 al Administrador.
app.escalado.alta-minutos=${ESCALADO_ALTA_MINUTOS:30}
app.escalado.media-minutos=${ESCALADO_MEDIA_MINUTOS:120}
app.escalado.baja-minutos=${ESCALADO_BAJA_MINUTOS:240}
app.escalado.revision-segundos=${ESCALADO_REVISION_SEGUNDOS:60}

# Metas de KPI aprobadas el 2026-10-04 (porcentajes y horas calendario). Recalibrar a los 60 días.
app.kpi.meta.sla-despacho=${KPI_META_SLA_DESPACHO:90}
app.kpi.alerta.sla-despacho=${KPI_ALERTA_SLA_DESPACHO:80}
app.kpi.meta.sla-atencion=${KPI_META_SLA_ATENCION:85}
app.kpi.meta.cola-mediana-horas=${KPI_META_COLA_MEDIANA_HORAS:1}
app.kpi.meta.cola-p90-horas=${KPI_META_COLA_P90_HORAS:4}
app.kpi.meta.decision-rq=${KPI_META_DECISION_RQ:90}
app.kpi.decision-rq-horas=${KPI_DECISION_RQ_HORAS:48}
app.kpi.meta.reasignacion-max=${KPI_META_REASIGNACION_MAX:10}
app.kpi.meta.devolucion-max=${KPI_META_DEVOLUCION_MAX:15}
app.kpi.meta.carga-max-persona=${KPI_META_CARGA_MAX_PERSONA:5}
