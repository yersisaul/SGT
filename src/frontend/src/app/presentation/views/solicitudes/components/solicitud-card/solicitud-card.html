<article
  class="solicitud-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Solicitud ' + item().raw.numeroSolicitud"
  (click)="open.emit()"
  (keydown.enter)="open.emit()"
>
  <header class="solicitud-card-header">
    <span class="solicitud-card-numero">{{ item().raw.numeroSolicitud }}</span>
    <div class="solicitud-card-header-badges">
      @if (mostrarSla) {
        <app-sla-indicator [fechaRegistro]="item().raw.fecha_registro" [fechaLimiteDespacho]="item().raw.fecha_limite_despacho" />
      }
      <app-badge [variant]="prioridadBadgeVariant(item().raw.prioridad)">{{ item().raw.prioridad }}</app-badge>
    </div>
  </header>

  <p class="solicitud-card-descripcion">{{ item().raw.descripcion }}</p>

  <div class="solicitud-card-meta">
    <span class="solicitud-card-meta-item">{{ item().usuarioNombre }}</span>
    <span class="solicitud-card-meta-item">{{ item().activoNombre }}</span>
  </div>

  <footer class="solicitud-card-footer">
    <span class="solicitud-card-fecha">{{ item().raw.fecha_registro | date: 'd MMM, HH:mm' }}</span>
    <div class="solicitud-card-actions">
      @if (item().raw.url_adjunto) {
        <svg lucidePaperclip [size]="14" class="solicitud-card-icon" aria-hidden="true"></svg>
      }
      @if (canDelete()) {
        <button
          type="button"
          class="solicitud-card-delete"
          aria-label="Eliminar solicitud"
          (click)="onDelete($event)"
        >
          <svg lucideTrash [size]="14" aria-hidden="true"></svg>
        </button>
      }
    </div>
  </footer>
</article>
