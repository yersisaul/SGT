<article
  class="orden-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Orden ' + item().raw.numeroOrden"
  (click)="open.emit()"
  (keydown.enter)="open.emit()"
>
  <header class="orden-card-header">
    <span class="orden-card-numero">{{ item().raw.numeroOrden }}</span>
    <app-badge [variant]="estadoBadgeVariant(item().estadoNombre)">{{ item().estadoNombre }}</app-badge>
  </header>

  <div class="orden-card-meta">
    <span class="orden-card-meta-item">{{ item().especialidadNombre }}</span>
  </div>

  <footer class="orden-card-footer">
    <span class="orden-card-fecha" [class.orden-card-fecha-alerta]="esAntigua">
      {{ item().raw.fecha_registro | date: 'd MMM' }} · {{ diasEnCurso }} {{ diasEnCurso === 1 ? 'día' : 'días' }}
    </span>
    <div class="orden-card-actions">
      @if (item().raw.url_adjunto) {
        <svg lucidePaperclip [size]="14" class="orden-card-icon" aria-hidden="true"></svg>
      }
      @if (canDelete()) {
        <button type="button" class="orden-card-delete" aria-label="Eliminar orden" (click)="onDelete($event)">
          <svg lucideTrash [size]="14" aria-hidden="true"></svg>
        </button>
      }
    </div>
  </footer>
</article>
