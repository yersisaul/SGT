<form [formGroup]="form" (ngSubmit)="submit()" class="ejecutar-form" novalidate>
  <app-select
    label="Estado"
    placeholder="Selecciona un estado"
    [options]="estadoOptions"
    formControlName="id_estado"
    [errorMessage]="form.controls.id_estado.touched && form.controls.id_estado.invalid ? 'Selecciona un estado' : null"
  />

  <app-file-upload
    label="Informe técnico / entregable"
    tipo="adjunto"
    [maxSizeMb]="10"
    [currentUrl]="urlAdjuntoActual"
    [formControl]="imagenControl"
    (eliminarActual)="onEliminarImagenActual()"
  />

  <div class="ejecutar-form-actions">
    <app-button type="submit" variant="primary" [loading]="submitting()">Actualizar progreso</app-button>
  </div>
</form>
