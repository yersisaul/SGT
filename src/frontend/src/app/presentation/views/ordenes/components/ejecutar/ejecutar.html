<form (ngSubmit)="submit()" class="ejecutar-form" novalidate>
  <app-file-upload
    label="Informe técnico / entregable"
    tipo="adjunto"
    [maxSizeMb]="10"
    [currentUrl]="urlAdjuntoActual"
    [formControl]="imagenControl"
    (eliminarActual)="onEliminarImagenActual()"
  />

  <div class="ejecutar-form-actions">
    <app-button type="submit" variant="secondary" [loading]="submitting()">Guardar informe</app-button>
  </div>
</form>
