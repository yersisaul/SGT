<form [formGroup]="form" (ngSubmit)="submit()" class="admin-form" novalidate>
  @if (esUsuarioActual) {
    <div class="admin-warning" role="alert">Estás editando tu propio usuario.</div>
  }

  <div class="admin-form-row">
    <app-input
      label="Nombres"
      formControlName="nombres"
      [errorMessage]="form.controls.nombres.touched && form.controls.nombres.invalid ? 'Los nombres son obligatorios' : null"
    />
    <app-input
      label="Apellidos"
      formControlName="apellidos"
      [errorMessage]="
        form.controls.apellidos.touched && form.controls.apellidos.invalid ? 'Los apellidos son obligatorios' : null
      "
    />
  </div>

  <app-input
    label="Correo electrónico"
    type="email"
    formControlName="email"
    autocomplete="off"
    [errorMessage]="
      form.controls.email.touched && form.controls.email.invalid ? 'Ingresa un correo electrónico válido' : null
    "
  />

  <app-select
    label="Rol"
    placeholder="Selecciona un rol"
    [options]="rolOptions"
    formControlName="id_rol"
    [errorMessage]="form.controls.id_rol.touched && form.controls.id_rol.invalid ? 'Selecciona el rol del usuario' : null"
  />

  <app-input
    [label]="mode() === 'create' ? 'Contraseña' : 'Nueva contraseña (opcional)'"
    type="password"
    formControlName="password"
    autocomplete="new-password"
    [placeholder]="mode() === 'create' ? '' : 'Dejar en blanco para no cambiarla'"
    [errorMessage]="
      form.controls.password.touched && form.controls.password.invalid ? 'Mínimo 8 caracteres' : null
    "
  />

  <app-file-upload
    label="Foto"
    tipo="imagen"
    [maxSizeMb]="5"
    [currentUrl]="urlImagenActual"
    [formControl]="imagenControl"
    (eliminarActual)="onEliminarImagenActual()"
  />

  <div class="admin-form-actions">
    <app-button type="button" variant="secondary" (click)="cancel.emit()">Cancelar</app-button>
    <app-button type="submit" variant="primary" [loading]="submitting()">
      {{ mode() === 'create' ? 'Crear usuario' : 'Guardar cambios' }}
    </app-button>
  </div>
</form>
