<form [formGroup]="form" (ngSubmit)="submit()" class="requerimiento-form" novalidate>
  <app-select
    label="Especialidad"
    placeholder="Selecciona una especialidad"
    [options]="especialidadOptions"
    formControlName="id_especialidad"
    [errorMessage]="
      form.controls.id_especialidad.touched && form.controls.id_especialidad.invalid
        ? 'Selecciona la especialidad responsable'
        : null
    "
  />

  @if (mode() === 'edit') {
    <app-select
      label="Estado"
      placeholder="Selecciona un estado"
      [options]="estadoOptions"
      formControlName="id_estado"
      [errorMessage]="form.controls.id_estado.touched && form.controls.id_estado.invalid ? 'Selecciona un estado' : null"
    />
  }

  <div class="field">
    <label for="req-descripcion" class="field-label">Descripción</label>
    <textarea
      id="req-descripcion"
      class="textarea"
      rows="4"
      formControlName="descripcion"
      placeholder="Describe el requerimiento fuera de contrato…"
      [class.textarea-error]="form.controls.descripcion.touched && form.controls.descripcion.invalid"
    ></textarea>
    @if (form.controls.descripcion.touched && form.controls.descripcion.invalid) {
      <div class="helper helper-error" role="alert">La descripción es obligatoria (máx. 1000 caracteres).</div>
    }
  </div>

  <app-input
    label="URL adjunto (opcional)"
    type="text"
    placeholder="https://…"
    formControlName="url_adjunto"
    [errorMessage]="
      form.controls.url_adjunto.touched && form.controls.url_adjunto.invalid
        ? 'Ingresa una URL válida (http:// o https://)'
        : null
    "
  />

  <div class="requerimiento-form-actions">
    <app-button type="button" variant="secondary" (click)="cancel.emit()">Cancelar</app-button>
    <app-button type="submit" variant="primary" [loading]="submitting()">
      {{ mode() === 'create' ? 'Crear requerimiento' : 'Guardar cambios' }}
    </app-button>
  </div>
</form>
