<header class="header">
  <button
    type="button"
    class="menu-toggle"
    (click)="toggleSidebar.emit()"
    aria-label="Abrir menú de navegación"
  >
    <svg lucideMenu [size]="22" aria-hidden="true"></svg>
  </button>

  <div class="header-actions">
    @if (puedeVerOrdenes()) {
      <a
        routerLink="/app/ordenes"
        class="icon-btn bell"
        [attr.aria-label]="bellLabel()"
        [attr.title]="bellLabel()"
      >
        <svg lucideBell [size]="20" aria-hidden="true"></svg>
        @if (pendientes() > 0) {
          <span class="bell-badge" aria-hidden="true">{{ pendientes() > 99 ? '99+' : pendientes() }}</span>
        }
      </a>
      <div class="header-divider"></div>
    }
    @if (user(); as currentUser) {
      <div class="user-info">
        <div class="user-avatar" aria-hidden="true">{{ initials() }}</div>
        <div class="user-text">
          <div class="user-name">{{ currentUser.nombres }} {{ currentUser.apellidos }}</div>
          <div class="user-role">{{ currentUser.rol }}</div>
        </div>
      </div>
    }
  </div>
</header>
